name: Security Config Scan

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  scan-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Scan for config malware signatures
        run: node scripts/check-malware-configs.mjs
